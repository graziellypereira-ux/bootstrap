	<h3 class="mb-3 text-center">Cadastre-se</h3>
    <div class="container mt-5">
		<form class="row g-3">
			<div class="col-md-6">

				<input type="email" class="form-control" id="InputEmail4" placeholder="Informe seu email">
			</div>
			<div class="col-md-6">
				<label for="inputPassword4" class="form-label">Senha</label>
				<input type="password" class="form-control" id="inputPassword4" placeholder="Informe sua senha">
			</div>
			<div class="col-12">
				<label for="inputAddress" class="form-label">Endereço</label>

			</div>
			<div class="col-12">

			<div class="col-md-6">
				<label for="inputCity" class="form-label">Cidade</label>
				<input type="text" class="form-control" id="inputCity">
			</div>
			<div class="col-md-4">
				<label for="inputState" class="form-label">Estado</label>
				<select id="inputState" class="form-select">
					<option selected>Choose...</option>
					<option>...</option>
				</select>
			</div>
			<div class="col-md-2">
				<label for="inputZip" class="form-label">Cep</label>
				<input type="text" class="form-control" id="inputCep">
			</div>
			<div class="col-12">
				<div class="form-check">
					<input class="form-check-input" type="checkbox" id="gridCheck">
					<label class="form-check-label" for="gridCheck">Lembre de mim</label>
				</div>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-primary">Login</button>
			</div>
		</form>
	</div>
